[project]
name = "swarm-solver"
version = "0.1.0"
description = "Résolveur de problèmes complexes multi-agents, 100 % local via Ollama"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5.1",
    "pydantic>=2.7",
    "numpy>=1.26",
    "rich>=13.7",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
swarm-solver = "swarm_solver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_solver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
